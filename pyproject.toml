[project]
name = "vitabel"
version = "0.1.1"
description = "A Python framework for loading, visualizing, aligning, and labeling high-resolution physiological time series."
authors = [
    {name = "Wolfgang J. Kern", email = "wolfgangjohannkern@gmail.com"},
    {name = "Benjamin Hackl", email = "benjamin.hackl@uni-graz.at"},
    {name = "Simon Orlob", email = "science@orlob.md"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0.0",
    "matplotlib>=3.9",
    "scipy>=1.14.1",
    "ipython>=8.23.0",
    "pyedflib>=0.1.41",
    "vitaldb>=1.4.11",
    "ipywidgets>=8.1.5",
    "ipympl>=0.9.5",
    "ipykernel>=6.9",
    "joblib>=1.4.0",
    "scikit-learn>=1.5.2",
]

[project.urls]
repository = "https://github.com/UniGrazMath/vitabel"
documentation = "https://vitabel.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/agent", "/AGENTS.md"]  # local, untracked notes

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.3",
    "pytest-cov>=6.0.0",
    "pytest-mpl>=0.17.0",
    "jupyter-server>=2.15.0",
    "jupyterlite>=0.5.0",
    "jupyterlite-pyodide-kernel>=0.5.1",
    "jupyterlab>=4.3.4",
    "sphinx>=8.1.3",
    "myst-parser>=4.0.0",
    "numpydoc>=1.8.0",
    "sphinx-autoapi>=3.4.0",
    "furo>=2024.8.6",
    "myst-nb>=1.2.0",
    "sphinxcontrib-bibtex>=2.6.4",
]

[tool.pytest.ini_options]
addopts = ["--cov=vitabel", "--cov-report=term-missing", "--mpl", "--mpl-baseline-path=tests/data"]
testpaths = ["tests"]
markers = [
    "golden: compares results against golden files in tests/data/golden (see tests/golden.py)",
]

[tool.ruff.format]
exclude = ["examples/*.ipynb"]  # notebooks keep their own formatting

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]
